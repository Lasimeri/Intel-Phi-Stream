# phi-stream defaults for scripts/phi-stream.sh and scripts/feed-relay.sh.
# Every key is also an environment variable, and anything already in the
# environment wins. To set one on this machine only, put it in
# phi-stream.local.conf beside this file (not tracked) or in
# ~/.config/phi-stream/phi-stream.conf. Shell-sourceable: quote a value
# with spaces. See scripts/conf.md.

# Where the service runs. Empty: on this machine. Set on a machine that
# only shows it (the desktop, the service on the GPU rack): a command that
# runs one command there with stdin passed through, the same with a
# terminal, and the checkout there. Every verb of phi-stream.sh then runs
# there when no service answers here (`window` opens its window here).
#   PHI_STREAM_HOST="ssh HOST"
#   PHI_STREAM_HOST_TTY="ssh -t HOST"
#   PHI_STREAM_HOST_DIR="/path/to/Intel Phi Stream"
PHI_STREAM_HOST=
PHI_STREAM_HOST_TTY=
PHI_STREAM_HOST_DIR=

# The options `dev` adds when none follow it on the command line (options
# after `dev` replace these). On a machine whose model is served by a
# llama-server (src/remote.md):
#   PHI_STREAM_DEV_ARGS="--remote http://127.0.0.1:8001 --frame agent --improve"
PHI_STREAM_DEV_ARGS=

# The stop's wait for the service's summary, seconds (a slower remote model
# needs more), and whether `start` keeps a desktop window open (0: no; the
# window is then opened from the machine that shows it).
PHI_STREAM_QUIT_WAIT=120
PHI_STREAM_WINDOW=1
